<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>어전 · eojeon</title>
  <link rel="stylesheet" href="/vendor/xterm.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="seal" aria-hidden="true">御</span>
      <div>
        <h1 id="appName">어전 · eojeon</h1>
        <p id="appSub" class="sub">Claude Code를 어전회의로. 교지를 내리면 AI 신하들이 일하고, 윤허를 청한다.</p>
      </div>
    </div>
    <form class="launch" id="launch" autocomplete="off">
      <label class="field folder">
        <span>작업 폴더</span>
        <input id="cwd" type="text" spellcheck="false" />
      </label>
      <label class="field session">
        <span>조회</span>
        <select id="session"></select>
      </label>
      <button type="submit" id="startBtn" class="btn primary">입궐 (시작)</button>
      <button type="button" id="stopBtn" class="btn">퇴청 (종료)</button>
      <span id="status" class="status" data-state="idle">대기</span>
    </form>
  </header>

  <main class="layout">
    <section class="stage-wrap" aria-label="궁궐 장면">
      <div class="stage" id="stage">
        <canvas id="scene" aria-hidden="true"></canvas>
        <div id="overlay" class="overlay"></div>
      </div>
    </section>

    <section class="term-wrap" aria-label="Claude Code 터미널">
      <div id="term" class="term"></div>
      <div id="termHint" class="term-hint">
        <p><b>입궐</b>을 누르면 이 폴더에서 <code>claude</code> 가 뜹니다.</p>
        <p class="muted">슬래시 명령·권한 창·/resume 이 모두 터미널 그대로 동작합니다.</p>
      </div>
      <form id="decreeForm" class="decree-bar" autocomplete="off">
        <label for="decreeInput" class="decree-label">교지 쓰기</label>
        <input id="decreeInput" type="text" placeholder="명령을 쓰고 Enter — 터미널에 그대로 들어갑니다" />
        <button class="btn">반포</button>
      </form>
    </section>

    <aside class="log-wrap" aria-label="사관 일지">
      <h2>사관 일지</h2>
      <ol id="log" class="log"></ol>
    </aside>
  </main>

  <footer class="foot">
    <span>모든 것이 이 컴퓨터 안에서만 돕니다 (127.0.0.1). 외부로 보내는 것 없음.</span>
    <span>Claude Code 비공식 도구 · MIT · 픽셀 글꼴 Galmuri (SIL OFL 1.1)</span>
  </footer>

  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
